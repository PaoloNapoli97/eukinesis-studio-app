<section class="contacts-container">
  <div class="info-container">
    <ul>

      <!-- List of contacts information -->
      @for (item of contactList; track $index) {
        <app-list [link]="item.link" [text]="item.title">
          <h3>{{item.description}}: </h3>
          <img [src]="item.icon" alt="">
        </app-list>
      }

    </ul>
  </div>

  <!-- Form for Email filling -->
  <div class="form-container">
    <form (ngSubmit)="onSubmit()" #f="ngForm">

      <!-- Style Row -->
      <div class="input-row">
        <input type="text" name="full-name" placeholder="Nome e Cognome" required [(ngModel)]="fullName">
        <input type="text" name="object" placeholder="Oggetto" required [(ngModel)]="object">
      </div>
      <textarea name="text" id="text" placeholder="Testo" required [(ngModel)]="text"></textarea>

      <!-- Style Button Row -->
      <div class="button-row">
        <button type="submit" [disabled]="f.invalid">Invia</button>
        <span>*Il servizio potrebbe non funzionare in base alle impostazioni dell'utente. Se questo dovesse essere il caso, si prega di usare l'email da noi fornita</span>
      </div>
    </form>
  </div>
</section>
