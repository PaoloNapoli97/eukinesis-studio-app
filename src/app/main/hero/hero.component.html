<div class="hero">
  <div class="hero-track-viewport" aria-hidden="true">
    <div
      class="hero-track"
      [style.transform]="trackTransform()"
      [style.transition]="transitionEnabled() ? 'transform 1s ease-in-out' : 'none'"
      (transitionend)="onTransitionEnd()">
      @for (image of extendedImages; track $index) {
        <div class="hero-slide" [style.background-image]="'url(' + image + ')'"></div>
      }
    </div>
  </div>

  <div class="hero-content slideshow">
    <h2>EUKINESIS STUDIO</h2>
    <p>Vorresti più informazioni per una consulenza?</p>
    <button (click)="scrollToContacts()">CONTATTACI</button>
  </div>

  @if (images.length > 1) {
    <div class="hero-dots">
      @for (image of images; track image; let i = $index) {
        <button
          class="dot"
          [class.active]="i === realIndex()"
          (click)="goTo(i)"
          [attr.aria-label]="'Vai alla slide ' + (i + 1)">
        </button>
      }
    </div>
  }
</div>
